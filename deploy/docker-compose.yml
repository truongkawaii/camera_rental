# =============================================================================
# Camera Rental — Deploy (Nginx Reverse Proxy + SSL)
#
# Kiến trúc:
#   Browser → :443 (nginx) ─┬─ /       → frontend:80 (React SPA)
#                            └─ /api/*  → backend:5000 (Express API)
#
# Database:
#   - DATABASE_URL trong .env: đang dùng Supabase (cloud)
#   - Container postgres chạy sẵn để switch sang local khi cần
#   - Schema tự động migrate khi backend khởi động (server.js)
#
# Truy cập:
#   - HTTP:  http://hethongchothuemayanh.com
#   - HTTPS: https://hethongchothuemayanh.com (sau khi chạy setup-ssl.sh)
# =============================================================================

services:
  # ===========================================================================
  # Nginx Reverse Proxy — điểm vào duy nhất ra internet
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: camera_rental_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - camera_rental_network
    restart: unless-stopped

  # ===========================================================================
  # Certbot — Let's Encrypt SSL (chỉ chạy khi cần lấy/gia hạn)
  # ===========================================================================
  certbot:
    image: certbot/certbot:latest
    container_name: camera_rental_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - camera_rental_network
    # Dùng: docker compose run --rm certbot certonly --webroot ...

  # ===========================================================================
  # PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: camera_rental_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-camera_rental}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - camera_rental_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Backend API (Express.js)
  # ===========================================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: camera_rental_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/camera_rental}
      PORT: ${BACKEND_PORT:-5000}
      NODE_ENV: ${NODE_ENV:-production}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_env}
      FRONTEND_URL: ${FRONTEND_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-camera-rental}
      MAX_IMAGES_PER_ENTITY: ${MAX_IMAGES_PER_ENTITY:-10}
    # Backend chỉ giao tiếp nội bộ qua nginx, không mở port ra ngoài
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - camera_rental_network
    restart: unless-stopped

  # ===========================================================================
  # Frontend (React + Nginx)
  #   - Serve static files
  # ===========================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Để trống → frontend gọi /api (relative) → nginx reverse proxy xử lý
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: camera_rental_frontend
    # Frontend chỉ giao tiếp nội bộ qua nginx, không mở port ra ngoài
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - camera_rental_network
    restart: unless-stopped

  # ===========================================================================
  # Database Backup — daily automated pg_dump at 2:00 AM
  # ===========================================================================
  backup:
    image: postgres:17-alpine
    container_name: camera_rental_backup
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-camera_rental}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?Missing CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Missing CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Missing CLOUDINARY_API_SECRET}
      CLOUDINARY_BACKUP_FOLDER: ${CLOUDINARY_BACKUP_FOLDER:-camera-rental-db-backup}
    volumes:
      - backups_data:/backups
      - ../scripts/backup-db.sh:/backup-db.sh:ro
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl openssl &&
      echo '0 2 * * * /backup-db.sh postgresql://$$PGUSER:$$PGPASSWORD@$$PGHOST:$$PGPORT/$$PGDATABASE' > /var/spool/cron/crontabs/root &&
      crond -f -l 2
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - camera_rental_network
    restart: unless-stopped

networks:
  camera_rental_network:
    driver: bridge

volumes:
  postgres_data:
  backups_data:
