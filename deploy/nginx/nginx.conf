# =============================================================================
# Nginx Reverse Proxy — hethongchothuemayanh.com
# HTTP luôn chạy. HTTPS hoạt động khi đã có SSL cert.
# Lần đầu lấy cert: docker compose run --rm certbot certonly --webroot ...
# Crontab tự renew: 0 3 * * * cd ... && docker compose run --rm certbot renew && docker compose restart nginx
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP (port 80)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name hethongchothuemayanh.com www.hethongchothuemayanh.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20M;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ---------------------------------------------------------------------------
# HTTPS (port 443)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name hethongchothuemayanh.com www.hethongchothuemayanh.com;

    ssl_certificate     /etc/letsencrypt/live/hethongchothuemayanh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hethongchothuemayanh.com/privkey.pem;
    include /etc/nginx/conf.d/ssl.conf;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20M;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
