services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: camera_rental_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-camera_rental}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - camera_rental_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camera_rental_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/camera_rental}
      PORT: ${BACKEND_PORT:-5000}
      NODE_ENV: ${NODE_ENV:-production}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_env}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-camera-rental}
      MAX_IMAGES_PER_ENTITY: ${MAX_IMAGES_PER_ENTITY:-10}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - camera_rental_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: camera_rental_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - camera_rental_network
    restart: unless-stopped

  # User-facing Next.js frontend
  user-frontend:
    build:
      context: ./user-fontend
      dockerfile: Dockerfile
    container_name: camera_rental_user_frontend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
      API_URL: ${USER_FRONTEND_API_URL:-http://backend:5000}
      PORT: ${USER_FRONTEND_PORT:-3000}
    ports:
      - "3001:3000"
    networks:
      - camera_rental_network
    restart: unless-stopped

  # pgAdmin for DB Management
  pgadmin:
    image: dpage/pgadmin4
    container_name: camera_rental_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - camera_rental_network
    restart: unless-stopped

networks:
  camera_rental_network:
    driver: bridge

volumes:
  postgres_data:
