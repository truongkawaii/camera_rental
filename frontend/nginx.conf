# =============================================================================
# Frontend Nginx — Serve React SPA + API proxy đến backend
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # API → proxy sang backend (Docker internal network, no CORS)
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bỏ Origin header để backend không cần check CORS
        # (request từ browser là same-origin vì qua nginx proxy)
        proxy_set_header Origin            "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20M;
    }

    # -----------------------------------------------------------------------
    # Static assets — cache dài hạn
    # -----------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -----------------------------------------------------------------------
    # SPA fallback — tất cả route khác trả về index.html
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
