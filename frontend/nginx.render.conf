# =============================================================================
# Frontend Nginx — Render (không proxy API, React gọi backend qua VITE_API_URL)
# =============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # Static assets — cache dài hạn
    # -----------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -----------------------------------------------------------------------
    # SPA fallback — tất cả route khác trả về index.html
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
